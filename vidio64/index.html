<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Name Generator</title>
</head>
<body>
    <script>
        let rand = Math.random();  // generates a random number between 0 and 1
        let first, second, third;

        // Generate the first word
        if (rand < 0.33) {
            first = "crazy";
        } else if (rand < 0.66) {
            first = "amazing";
        } else {
            first = "Fire";
        }

        // Generate the second word
        if (rand < 0.33) {
            second = "Engine";
        } else if (rand < 0.66) {
            second = "Foods";
        } else {
            second = "Garments";
        }

        // Generate the third word
        if (rand < 0.33) {
            third = "Bros";
        } else if (rand < 0.66) {
            third = "Limited";
        } else {
            third = "Hub";
        }

        // Correct template string
        console.log(`${first} ${second} ${third}`);
    </script>
</body>
</html>
